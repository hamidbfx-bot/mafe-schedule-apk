name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Add alarm sound resource
        run: |
          mkdir -p android/app/src/main/res/raw
          cp native-assets/alarm.wav android/app/src/main/res/raw/alarm.wav

      - name: Add notification & exact-alarm permissions
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              manifest = f.read()

          permissions = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.USE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.WAKE_LOCK',
              'android.permission.VIBRATE',
          ]
          to_add = ''
          for perm in permissions:
              if perm not in manifest:
                  to_add += f'    <uses-permission android:name="{perm}" />\n'

          if to_add:
              manifest = manifest.replace('<application', to_add + '\n    <application', 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(manifest)
              print('Added permissions:\n' + to_add)
          else:
              print('All permissions already present.')
          PYEOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TutorSchedule-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
